<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit session</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Layout de base */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    main {
      max-width: 720px;
      margin: 1.5rem auto;
      padding: 0 1rem 2rem;
      background: #ffffff;
      border-radius: 0.5rem;
      border: 1px solid #d1d5db;
    }
    h1 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    /* Form & inputs */
    label {
      display: block;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 0.3rem 0.4rem;
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }
    fieldset {
      border: 1px solid #e5e7eb;
      border-radius: 0.25rem;
      padding: 0.6rem 0.8rem 0.8rem;
      margin-top: 0.75rem;
    }
    fieldset legend {
      font-size: 0.8rem;
      padding: 0 0.25rem;
      color: #6b7280;
    }
    .small {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }
    .small.error {
      color: #b91c1c;
    }
    .small.success {
      color: #166534;
    }

    /* Boutons */
    button {
      margin-top: 0.75rem;
      padding: 0.35rem 0.8rem;
      font-size: 0.9rem;
      border-radius: 0.25rem;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }

    /* Layout en lignes */
    .inline-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .inline-row .field {
      flex: 1;
    }

    /* Attendees */
    .attendees {
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }
    .attendee-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .attendee-row span {
      flex: 1;
    }
    .attendee-row button {
      margin-top: 0;
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
      background: #ef4444;
      color: #ffffff;
    }
    .attendee-row button:hover {
      background: #b91c1c;
    }

    .muted {
      color: #9ca3af;
    }
    .datetime-row {
      display: flex;
      flex-wrap: wrap;           /* casse en ligne suivante si l’écran est trop étroit */
      gap: 1rem;                 /* espace entre les blocs */
      align-items: flex-end;     /* aligne les inputs sur la ligne de base */
    }

    .datetime-field {
      display: flex;
      flex-direction: column;    /* label au-dessus de l’input */
    }
    .datetime-field {
      flex: 1 1 200px;           /* chaque bloc prend une largeur flexible */
    }
  </style>
</head>
<body>
  <main>
    <h1 id="page-title">Edit session</h1>
    <!-- Message global (chargement / erreurs) -->
    <div id="status" class="small">Loading...</div>

    <!-- Formulaire d’édition de session -->
    <form id="edit-session-form" style="display:none;">
      <!-- Activity dropdown -->
      <fieldset>
        <legend>Activity</legend>
        <label for="activity_type">Activity</label>
        <select name="activity_type" id="activity_type"></select>
        <div class="small">
          Choose the activity type for this session.
        </div>
      </fieldset>

      <!-- Teacher / Moderator responsable -->
      <fieldset>
        <legend>Teacher / Moderator</legend>
        <label for="moderator_id">Teacher / Moderator</label>
        <select name="moderator_id" id="moderator_id">
          <!-- valeur vide = aucun responsable -->
          <option value="">– No one –</option>
        </select>
        <div class="small">
          Select who is responsible for this session.
        </div>
      </fieldset>

      <!-- Date & time: séparation date / heure -->
      <fieldset>
        <legend>Date & time (UTC)</legend>

        <div class="datetime-row">
          <div class="datetime-field">
            <label for="start_date">Start date</label>
            <input type="date" name="start_date" id="start_date">
          </div>

          <div class="datetime-field">
            <label for="start_time">Start time</label>
            <input type="time" name="start_time" id="start_time" step="60">
          </div>

          <div class="datetime-field">
            <label for="end_time">End time</label>
            <input type="time" name="end_time" id="end_time" step="60">
          </div>
          
        </div>

        <div class="small">
          Displayed as: <span id="starts_at_display" class="muted">–</span>
        </div>
      </fieldset>

      <!-- Capacity & credits -->
      <fieldset>
        <legend>Capacity & credits</legend>
        <div class="inline-row">
          <div class="field">
            <label for="capacity">Capacity</label>
            <input type="number" name="capacity" id="capacity" min="1" inputmode="numeric">
          </div>
          <div class="field">
            <label for="credit_cost">Credit cost</label>
            <input type="number" name="credit_cost" id="credit_cost" min="0" inputmode="numeric">
          </div>
        </div>
      </fieldset>

      <!-- Attendees list + remove -->
      <fieldset>
        <legend>Attendees</legend>
        <div id="attendees-container" class="attendees">
          <div class="small muted">No attendees.</div>
        </div>
        <div class="small">
          Click “Remove” to unregister a user from this session.
        </div>
      </fieldset>

      <button type="submit" class="btn-primary">Save</button>
      <div id="save-status" class="small"></div>
    </form>
  </main>

  <script>
    (function () {
      const apiBase = 'http://localhost:3000/api';

      let auth = null;
      const statusEl = document.getElementById('status');
      const saveStatusEl = document.getElementById('save-status');
      const form = document.getElementById('edit-session-form');
      const pageTitle = document.getElementById('page-title');

      // Champs principaux
      const activitySelect = document.getElementById('activity_type');
      const moderatorSelect = document.getElementById('moderator_id');

      const startDateInput = document.getElementById('start_date');
      const startTimeInput = document.getElementById('start_time');
      const endTimeInput = document.getElementById('end_time');
      const startsAtDisplay = document.getElementById('starts_at_display');

      const capacityInput = document.getElementById('capacity');
      const creditCostInput = document.getElementById('credit_cost');
      const attendeesContainer = document.getElementById('attendees-container');

      /* --------------------------------------------------------------------
       * Auth: récupère surfAuth depuis localStorage
       * ------------------------------------------------------------------ */
      function loadAuthFromStorage() {
        try {
          const raw = window.localStorage.getItem('surfAuth');
          if (!raw) return null;
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      /* --------------------------------------------------------------------
       * Wrapper fetch JSON avec token Bearer + gestion erreurs
       * ------------------------------------------------------------------ */
      async function fetchJson(path, options = {}) {
        const headers = {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        };
        if (auth && auth.token) {
          headers.Authorization = 'Bearer ' + auth.token;
        }
        const res = await fetch(apiBase + path, {
          ...options,
          headers,
        });
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || res.statusText);
        }
        // Si 204, aucun JSON à retourner
        if (res.status === 204) {
          return null;
        }
        return res.json();
      }

      /* --------------------------------------------------------------------
       * Utilitaires date/heure
       * - parse ISO pour remplir date + time
       * - recompose ISO depuis date + time (UTC)
       * ------------------------------------------------------------------ */

      // ISO -> { date: 'YYYY-MM-DD', time: 'HH:MM' } en UTC
      function isoToDateAndTime(iso) {
        if (!iso) return { date: '', time: '' };
        const d = new Date(iso);
        const yyyy = d.getUTCFullYear();
        const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(d.getUTCDate()).padStart(2, '0');
        const hh = String(d.getUTCHours()).padStart(2, '0');
        const min = String(d.getUTCMinutes()).padStart(2, '0');
        return {
          date: `${yyyy}-${mm}-${dd}`,
          time: `${hh}:${min}`,
        };
      }

      // { date: 'YYYY-MM-DD', time: 'HH:MM' } -> ISO (UTC)
      function dateAndTimeToIso(date, time) {
        if (!date || !time) return null;
        // On construit une date en UTC en ajoutant 'Z'
        const isoString = `${date}T${time}:00Z`;
        return new Date(isoString).toISOString();
      }

      // Format humain pour affichage (Monday, 12 August 2026, 14:00)
      function formatHumanDate(iso) {
        if (!iso) return '–';
        const d = new Date(iso);
        return d.toLocaleString('en-GB', {
          weekday: 'long',
          day: '2-digit',
          month: 'long',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
        });
      }

      // Met à jour le label "Displayed as" dès que date/heure changent
      function updateStartsAtDisplay() {
        const iso = dateAndTimeToIso(startDateInput.value, startTimeInput.value);
        startsAtDisplay.textContent = formatHumanDate(iso);
      }

      /* --------------------------------------------------------------------
       * Gestion du message de sauvegarde
       * ------------------------------------------------------------------ */
      function setSaveStatus(message, type) {
        saveStatusEl.textContent = message || '';
        saveStatusEl.classList.remove('error', 'success');
        if (type === 'error') {
          saveStatusEl.classList.add('error');
        } else if (type === 'success') {
          saveStatusEl.classList.add('success');
        }
      }

      /* --------------------------------------------------------------------
       * Activity types : même logique que ta version d’origine
       * ------------------------------------------------------------------ */
      async function loadActivityTypes(currentCode) {
        const types = await fetchJson('/activity-types');

        // 1) Remove duplicate bike_tour based on code
        const deduped = [];
        let bikeSeen = false;

        for (const t of types) {
          if (t.code === 'bike_tour') {
            if (bikeSeen) {
              continue;
            }
            bikeSeen = true;
            deduped.push(t);
          } else if (t.code === 'skate_lesson') {
            // On ne garde pas skate_lesson 'brut', on ajoutera les variantes ensuite
            continue;
          } else {
            deduped.push(t);
          }
        }

        // 2) Variantes de skate lesson
        deduped.push({
          code: 'skate_lesson_beginner',
          label: 'Skate lesson – Beginner',
        });
        deduped.push({
          code: 'skate_lesson_inter_advanced',
          label: 'Skate lesson – Inter & Advanced',
        });

        // 3) Remplissage du select
        activitySelect.innerHTML = '';
        deduped.forEach((t) => {
          const opt = document.createElement('option');
          opt.value = t.code;
          opt.textContent = t.label;

          if (t.code === currentCode) {
            opt.selected = true;
          }
          activitySelect.appendChild(opt);
        });
      }

      // Chargement des moderators
      async function loadModerators(currentModeratorId) {
        const moderators = await fetchJson('/users?role=moderator'); // à adapter à ton backend
        moderatorSelect.innerHTML = '';

        // Option par défaut "no one" (null)
        const noneOpt = document.createElement('option');
        noneOpt.value = '';
        noneOpt.textContent = '– No one –';
        moderatorSelect.appendChild(noneOpt);

        moderators.forEach((u) => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = `${u.firstName} ${u.lastName} (${u.email})`;
          if (currentModeratorId && String(u.id) === String(currentModeratorId)) {
            opt.selected = true;
          }
          moderatorSelect.appendChild(opt);
        });
      }
      
      /* --------------------------------------------------------------------
       * Attendees list + bouton Remove
       * - GET /sessions/:id/attendees
       * - POST /sessions/:id/roster { userId, action: 'remove' }
       * ------------------------------------------------------------------ */
      async function loadAttendees(sessionId) {
        try {
          const attendees = await fetchJson(`/sessions/${sessionId}/attendees`);
          attendeesContainer.innerHTML = '';

          if (!attendees || !attendees.length) {
            const empty = document.createElement('div');
            empty.className = 'small muted';
            empty.textContent = 'No attendees.';
            attendeesContainer.appendChild(empty);
            return;
          }

          attendees.forEach((a) => {
            const row = document.createElement('div');
            row.className = 'attendee-row';

            const label = document.createElement('span');
            label.textContent = `${a.firstName} ${a.lastName} (${a.email || a.id})`;

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = 'Remove';
            btn.addEventListener('click', async () => {
              try {
                await fetchJson(`/sessions/${sessionId}/roster`, {
                  method: 'POST',
                  body: JSON.stringify({
                    userId: a.id,
                    action: 'remove',
                  }),
                });
                await loadAttendees(sessionId);
              } catch (e) {
                console.error(e);
                alert('Failed to remove attendee: ' + (e.message || 'Unknown error'));
              }
            });

            row.appendChild(label);
            row.appendChild(btn);
            attendeesContainer.appendChild(row);
          });
        } catch (e) {
          console.error(e);
          attendeesContainer.innerHTML =
            '<div class="small error">Failed to load attendees.</div>';
        }
      }

      /* --------------------------------------------------------------------
       * init() : contrôle rôle, chargement de la session, remplissage formulaire
       * ------------------------------------------------------------------ */
      async function init() {
        auth = loadAuthFromStorage();
        if (!auth || (auth.user.role !== 'admin' && auth.user.role !== 'moderator')) {
          statusEl.textContent = 'Access denied: admin or moderator only.';
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) {
          statusEl.textContent = 'Missing session ID in URL.';
          return;
        }

        try {
          statusEl.textContent = 'Loading session...';
          const session = await fetchJson('/sessions/' + id);

          // Titre de l’onglet basé sur le label de l’activité
          document.title = `Edit – ${session.activity_label}`;
          pageTitle.textContent = `Edit session: ${session.activity_label}`;

          // Load activity types and select current one
          await loadActivityTypes(session.activity_code);

          // Nouveau : charge les moderators et sélectionne celui de la session
          await loadModerators(session.moderator_id);

          // Remplir date + heure depuis starts_at (et éventuellement ends_at)
          const start = isoToDateAndTime(session.starts_at);
          startDateInput.value = start.date;
          startTimeInput.value = start.time;

          if (session.ends_at) {
            const end = isoToDateAndTime(session.ends_at);
            endTimeInput.value = end.time;
          }

          updateStartsAtDisplay();

          // Capacity & credits
          capacityInput.value = session.capacity;
          creditCostInput.value = session.credit_cost;

          // Attendees
          await loadAttendees(id);

          form.style.display = 'block';
          statusEl.textContent = '';
        } catch (e) {
          console.error(e);
          statusEl.textContent =
            'Error loading session: ' + (e.message || 'Error');
        }
      }

      /* --------------------------------------------------------------------
       * Listeners : mise à jour de l’affichage humain
       * ------------------------------------------------------------------ */
      startDateInput.addEventListener('input', updateStartsAtDisplay);
      startTimeInput.addEventListener('input', updateStartsAtDisplay);

      /* --------------------------------------------------------------------
       * Soumission du formulaire: PUT /sessions/:id
       * ------------------------------------------------------------------ */
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        setSaveStatus('Saving...', null);

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) {
          setSaveStatus('Missing session ID.', 'error');
          return;
        }

        const startsIso = dateAndTimeToIso(startDateInput.value, startTimeInput.value);
        const endsIso = dateAndTimeToIso(startDateInput.value, endTimeInput.value); // même date, heure de fin

        const capacity = Number(capacityInput.value);
        const creditCost = Number(creditCostInput.value);
        const moderatorId = moderatorSelect.value || null;

        if (!startsIso) {
          setSaveStatus('Please provide start date and time.', 'error');
          return;
        }
        if (!Number.isFinite(capacity) || capacity < 1) {
          setSaveStatus('Invalid capacity (minimum 1).', 'error');
          return;
        }
        if (!Number.isFinite(creditCost) || creditCost < 0) {
          setSaveStatus('Invalid credit cost (minimum 0).', 'error');
          return;
        }

        // Payload aligné avec ton backend (à adapter si needed)
        const payload = {
          activityTypeCode: activitySelect.value,
          startsAt: startsIso,
          endsAt: endsIso,       // si tu ne gères pas endTime pour l’instant, tu peux le retirer
          capacity,
          creditCost,
          moderatorId, // null si "no one"
        };

        try {
          await fetchJson('/sessions/' + id, {
            method: 'PUT',
            body: JSON.stringify(payload),
          });
          setSaveStatus('Session updated.', 'success');
        } catch (e) {
          console.error(e);
          setSaveStatus(
            'Error while saving: ' + (e.message || 'Error'),
            'error'
          );
        }
      });

      // Lancement initial
      init();
    })();
  </script>
</body>
</html>
