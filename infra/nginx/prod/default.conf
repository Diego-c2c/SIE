server {
    listen 80; # Nginx écoute dans le conteneur sur le port 80
    server_name _; # Accepte toutes les requêtes, pratique pour test par IP

    root /usr/share/nginx/html; # Dossier contenant les fichiers statiques
    index index.html; # Fichier d'entrée du frontend

    location / {
        try_files $uri $uri/ /index.html;
        # Sert les fichiers existants
        # Sinon renvoie index.html pour permettre au frontend de fonctionner
    }

    location /api/ {
        proxy_pass http://api:3000;
        # IMPORTANT: pas de "/" final ici
        # Comme ça, /api/health reste /api/health côté backend

        proxy_http_version 1.1; # Version HTTP recommandée pour le proxy
        proxy_set_header Host $host; # Conserve le Host original
        proxy_set_header X-Real-IP $remote_addr; # Transmet l'IP réelle du client
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Chaîne des proxys
        proxy_set_header X-Forwarded-Proto $scheme; # Indique si la requête initiale était en http/https
    }
}
